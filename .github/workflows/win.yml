name: Windows x64
run-name: Windows x64 Release | ${{ github.event_name }} | ${{ github.ref_name }}

"on":
  workflow_dispatch:
  push:
    branches: [dev]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'changelog.txt'

permissions:
  contents: read

concurrency:
  group: windows-x64-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    name: Windows x64 Release
    runs-on: windows-2025
    timeout-minutes: 360
    env:
      SOURCE_ROOT: ${{ github.workspace }}\TBuild\tdesktop
      BUILD_ROOT: ${{ github.workspace }}\TBuild
      CMAKE_BUILD_PARALLEL_LEVEL: 4
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          submodules: recursive
          path: TBuild/tdesktop
          persist-credentials: false

      - name: Prepare directories
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force "$env:BUILD_ROOT\Libraries", "$env:BUILD_ROOT\ThirdParty", "$env:GITHUB_WORKSPACE\logs" | Out-Null
          $key = '${{ hashFiles('TBuild/tdesktop/Telegram/build/prepare/**', 'TBuild/tdesktop/Telegram/build/qt_version.py') }}'
          "DEPENDENCY_KEY=windows-x64-msvc144-qt6-release-v2-$key" >> $env:GITHUB_ENV
          "LEGACY_DEPENDENCY_KEY=windows-x64-msvc144-qt6-release-v1-$key" >> $env:GITHUB_ENV

      - name: Install ATL for MSVC 14.44
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vsPath = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.14.44.17.14.x86.x64 -property installationPath
          if (!$vsPath) { throw 'Visual Studio with MSVC 14.44 not found' }
          $toolset = Get-ChildItem "$vsPath\VC\Tools\MSVC" -Directory | Where-Object Name -Like '14.44.*' | Sort-Object Name -Descending | Select-Object -First 1
          if (!$toolset) { throw 'MSVC 14.44 directory not found' }
          $atl = Join-Path $toolset.FullName 'atlmfc\include'
          if (!(Test-Path (Join-Path $atl 'atlbase.h'))) {
            $installer = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\setup.exe"
            $arguments = @('modify', '--installPath', ('"{0}"' -f $vsPath), '--add', 'Microsoft.VisualStudio.Component.VC.14.44.17.14.ATL', '--quiet', '--norestart', '--nocache')
            $installation = Start-Process -FilePath $installer -ArgumentList $arguments -WindowStyle Hidden -Wait -PassThru
            if ($installation.ExitCode -notin @(0, 3010)) { throw "ATL installation failed: $($installation.ExitCode)" }
          }
          foreach ($header in @('atlbase.h', 'atlcomcli.h')) {
            if (!(Test-Path (Join-Path $atl $header))) { throw "ATL header missing: $atl\$header" }
          }
          Write-Host "ATL verified: $atl"

      - name: MSVC environment
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756
        with:
          arch: x64
          sdk: 10.0.26100.0
          toolset: '14.44'

      - name: Restore dependencies
        id: dependencies
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ${{ env.BUILD_ROOT }}\Libraries
            ${{ env.BUILD_ROOT }}\ThirdParty
          key: ${{ env.DEPENDENCY_KEY }}
          restore-keys: ${{ env.LEGACY_DEPENDENCY_KEY }}

      - name: Prepare dependencies
        shell: pwsh
        run: |
          $prepare = "$env:SOURCE_ROOT\Telegram\build\prepare\win.bat"
          $rust = "$env:BUILD_ROOT\Libraries\win64\tdesktop_rust"
          if ((Test-Path "$rust\out\lib\tdesktop_rust.lib") -and !(Test-Path "$rust\out\src\wallet_engine\wallet_engine.cpp")) {
            & $prepare silent qt6 tlottie wallet-engine tdesktop_rust 2>&1 | Tee-Object "$env:GITHUB_WORKSPACE\logs\cache-repair.log"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          & $prepare silent qt6 2>&1 | Tee-Object "$env:GITHUB_WORKSPACE\logs\dependencies.log"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Reduce dependency cache size
        if: steps.dependencies.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $root = (Resolve-Path "$env:BUILD_ROOT\Libraries").Path
          $files = Get-ChildItem -LiteralPath $root -File -Recurse -Force
          foreach ($file in $files) {
            if ($file.FullName -match '\\tdesktop_rust\\out\\' -or $file.Extension -match '^\.(lib|a|exe|h|hpp|inc|cmake|pc)$' -or $file.FullName -match '\\(include|objects-[^\\]+|cache_keys|patches|nv-codec-headers)\\') { continue }
            if (!$file.FullName.StartsWith($root + '\', [StringComparison]::OrdinalIgnoreCase)) { throw 'Unexpected cleanup path' }
            Remove-Item -LiteralPath $file.FullName -Force
          }

      - name: Save dependencies
        if: steps.dependencies.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ${{ env.BUILD_ROOT }}\Libraries
            ${{ env.BUILD_ROOT }}\ThirdParty
          key: ${{ env.DEPENDENCY_KEY }}

      - name: Configure Release
        shell: pwsh
        env:
          TDESKTOP_API_ID: ${{ secrets.TDESKTOP_API_ID }}
          TDESKTOP_API_HASH: ${{ secrets.TDESKTOP_API_HASH }}
        run: |
          if (!$env:TDESKTOP_API_ID -or !$env:TDESKTOP_API_HASH) { throw 'Missing TDESKTOP_API_ID or TDESKTOP_API_HASH repository secrets' }
          Set-Location "$env:SOURCE_ROOT\Telegram"
          & .\configure.bat qt6 -G 'Ninja Multi-Config' -D CMAKE_CONFIGURATION_TYPES=Release -D CMAKE_BUILD_TYPE=Release -D CMAKE_COMPILE_WARNING_AS_ERROR=OFF -D DESKTOP_APP_DISABLE_AUTOUPDATE=OFF -D DESKTOP_APP_DISABLE_CRASH_REPORTS=OFF -D "TDESKTOP_API_ID=$env:TDESKTOP_API_ID" -D "TDESKTOP_API_HASH=$env:TDESKTOP_API_HASH" 2>&1 | Tee-Object "$env:GITHUB_WORKSPACE\logs\configure.log"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build Release
        shell: pwsh
        run: |
          cmake --build "$env:SOURCE_ROOT\out" --config Release --target Telegram Updater --parallel 4 2>&1 | Tee-Object "$env:GITHUB_WORKSPACE\logs\build.log"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Package executables
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force "$env:GITHUB_WORKSPACE\artifact" | Out-Null
          Copy-Item -LiteralPath "$env:SOURCE_ROOT\out\Release\Telegram.exe", "$env:SOURCE_ROOT\out\Release\Updater.exe" -Destination "$env:GITHUB_WORKSPACE\artifact"
          Get-FileHash "$env:GITHUB_WORKSPACE\artifact\*.exe" | Format-Table -AutoSize

      - name: Upload Windows EXE
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: Xenon-Windows-x64-Release
          path: artifact/*.exe
          if-no-files-found: error
          retention-days: 14

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: Windows-build-logs
          path: logs/
          retention-days: 7
