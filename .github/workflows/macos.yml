name: macOS
run-name: macOS Release | ${{ github.event_name }} | ${{ github.ref_name }}

"on":
  workflow_dispatch:
  push:
    branches: [dev]
    paths-ignore: ['**.md', 'docs/**', 'changelog.txt']

permissions:
  actions: write
  contents: read

concurrency:
  group: macos-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  macos:
    name: macOS arm64 Release
    if: ${{ github.event_name != 'push' || !contains(github.event.head_commit.message, '[skip macos]') }}
    runs-on: macos-15
    timeout-minutes: 360
    env:
      TDESKTOP_MAC_TOOLCHAIN: system
      DEVELOPER_DIR: /Applications/Xcode.app/Contents/Developer
      CMAKE_BUILD_PARALLEL_LEVEL: 3
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: TBuild/tdesktop
          submodules: recursive
          persist-credentials: false

      - name: Check API credentials
        env:
          API_ID: ${{ secrets.TDESKTOP_API_ID }}
          API_HASH: ${{ secrets.TDESKTOP_API_HASH }}
        run: test -n "$API_ID" && test -n "$API_HASH"

      - name: Prepare tools
        run: |
          df -h
          brew install automake libtool cmake wget pkg-config gnu-tar ninja nasm meson
          SDKROOT=$(xcrun --sdk macosx --show-sdk-path)
          DEPLOYMENT_TARGET=$(/usr/libexec/PlistBuddy -c 'Print :SupportedTargets:macosx:MinimumDeploymentTarget' "$SDKROOT/SDKSettings.plist")
          echo "SDKROOT=$SDKROOT" >> "$GITHUB_ENV"
          echo "MACOSX_DEPLOYMENT_TARGET=$DEPLOYMENT_TARGET" >> "$GITHUB_ENV"
          { xcodebuild -version; xcrun clang --version; xcrun --sdk macosx --show-sdk-version; echo "$DEPLOYMENT_TARGET"; } > "$RUNNER_TEMP/mac-toolchain.txt"
          echo "MAC_TOOLCHAIN_KEY=$(shasum -a 256 "$RUNNER_TEMP/mac-toolchain.txt" | cut -d ' ' -f 1)" >> "$GITHUB_ENV"
          df -h

      - name: Restore dependencies
        id: dependency_cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            TBuild/Libraries
            TBuild/ThirdParty
          key: macos-arm64-release-libs-v3-${{ env.MAC_TOOLCHAIN_KEY }}-${{ hashFiles('TBuild/tdesktop/Telegram/build/prepare/**', 'TBuild/tdesktop/Telegram/build/qt_version.py', 'TBuild/tdesktop/Telegram/build/build_mac.py') }}
          restore-keys: |
            macos-arm64-release-libs-v2-${{ env.MAC_TOOLCHAIN_KEY }}-
            macos-arm64-release-libs-v1-${{ env.MAC_TOOLCHAIN_KEY }}-${{ hashFiles('TBuild/tdesktop/Telegram/build/prepare/**', 'TBuild/tdesktop/Telegram/build/qt_version.py', 'TBuild/tdesktop/Telegram/build/build_mac.py') }}-

      - name: Prepare dependencies
        id: prepare
        run: |
          cd TBuild
          QT_VERSION=$(python3 -c 'import os, sys; sys.path.insert(0, "tdesktop/Telegram/build"); import qt_version; qt_version.resolve(""); print(os.environ["QT"])')
          if [ -d Libraries/local/Qt-"$QT_VERSION" ] && [ ! -x Libraries/local/Qt-"$QT_VERSION"/libexec/moc ]; then
            echo "Cached Qt tools are missing; rebuilding Qt."
            rm -f "Libraries/cache_keys/qt_$QT_VERSION"
          fi
          if [ -d Libraries/local/include/wallet_engine ] && [ ! -f Libraries/local/src/wallet_engine/wallet_engine.cpp ]; then
            echo "Cached wallet engine source is missing; rebuilding its dependencies."
            rm -f Libraries/cache_keys/tlottie Libraries/cache_keys/wallet-engine Libraries/cache_keys/tdesktop_rust
          fi
          if [ ! -s Libraries/crashpad/out/Release.arm64/crashpad_handler ]; then
            rm -f Libraries/cache_keys/crashpad
          fi
          ./tdesktop/Telegram/build/prepare/mac.sh silent
          test -x "Libraries/local/Qt-$QT_VERSION/libexec/moc"
          test -s Libraries/local/src/wallet_engine/wallet_engine.cpp
          test -s Libraries/crashpad/out/Release.arm64/crashpad_handler
          df -h

      - name: Reduce dependency cache size
        if: ${{ !cancelled() && steps.prepare.outcome != 'skipped' }}
        run: |
          if [ -d TBuild/Libraries ]; then
            find TBuild/Libraries '(' '(' ! '(' -name 'crashpad_handler' -o -name '*.a' -o -name '*.h' -o -name '*.hpp' -o -name '*.inc' -o -name '*.cmake' -o -name '*.pc' -o -name 'macos_toolchain.json' -o -path '*/local/*' -o -path '*/bin/*' -o -path '*/libexec/*' -o -path '*/include/*' -o -path '*/objects-*' -o -path '*/cache_keys/*' -o -path '*/patches/*' ')' -type f ')' -o -empty ')' -delete
          fi

      - name: Remove replaced dependency cache
        if: ${{ !cancelled() && steps.prepare.outcome == 'success' && steps.dependency_cache.outputs.cache-hit != 'true' && steps.dependency_cache.outputs.cache-matched-key != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          OLD_CACHE_KEY: ${{ steps.dependency_cache.outputs.cache-matched-key }}
        run: gh cache delete "$OLD_CACHE_KEY" --repo "$GITHUB_REPOSITORY"

      - name: Save dependencies
        if: ${{ !cancelled() && steps.prepare.outcome == 'success' && steps.dependency_cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            TBuild/Libraries
            TBuild/ThirdParty
          key: macos-arm64-release-libs-v3-${{ env.MAC_TOOLCHAIN_KEY }}-${{ hashFiles('TBuild/tdesktop/Telegram/build/prepare/**', 'TBuild/tdesktop/Telegram/build/qt_version.py', 'TBuild/tdesktop/Telegram/build/build_mac.py') }}

      - name: Restore intermediate build
        id: build_cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: TBuild/tdesktop/out
          key: macos-arm64-ninja-objects-v1-${{ env.MAC_TOOLCHAIN_KEY }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: macos-arm64-ninja-objects-v1-${{ env.MAC_TOOLCHAIN_KEY }}-

      - name: Restore source timestamps
        run: |
          cd TBuild/tdesktop
          python3 .github/scripts/macos_cache_mtimes.py restore out/.ci-source-mtimes.json

      - name: Keep compiler warnings non-fatal
        run: |
          grep -Fx '        -Werror' TBuild/tdesktop/cmake/options_mac.cmake
          sed -i '' '/^        -Werror$/d' TBuild/tdesktop/cmake/options_mac.cmake

      - name: Build Release
        id: build
        env:
          API_ID: ${{ secrets.TDESKTOP_API_ID }}
          API_HASH: ${{ secrets.TDESKTOP_API_HASH }}
        run: |
          cd TBuild/tdesktop/Telegram
          ./configure.sh \
            -GNinja \
            -D CMAKE_BUILD_TYPE=Release \
            -D CMAKE_OSX_SYSROOT="$SDKROOT" \
            -D CMAKE_OSX_DEPLOYMENT_TARGET="$MACOSX_DEPLOYMENT_TARGET" \
            -D CMAKE_OSX_ARCHITECTURES=arm64 \
            -D DESKTOP_APP_MAC_ARCH=arm64 \
            -D DESKTOP_APP_SPECIAL_TARGET=mac \
            -D DESKTOP_APP_ENABLE_LTO=OFF \
            -D DESKTOP_APP_DISABLE_AUTOUPDATE=OFF \
            -D TDESKTOP_DISABLE_PACKER=ON \
            -D "TDESKTOP_API_ID=$API_ID" -D "TDESKTOP_API_HASH=$API_HASH"
          (cd .. && python3 .github/scripts/macos_cache_mtimes.py restore out/.ci-source-mtimes.json && python3 .github/scripts/macos_cache_mtimes.py save out/.ci-source-mtimes.json)
          ninja -C ../out -n -d explain Telegram > ../out/ci-rebuild-reasons.log 2>&1
          awk '/^ninja explain:/ { print; if (++count == 100) exit }' ../out/ci-rebuild-reasons.log
          set +e
          cmake --build ../out --config Release --target Telegram --parallel 3 &
          build_pid=$!
          ( sleep 18000; kill -INT "$build_pid" 2>/dev/null || true ) &
          timer_pid=$!
          wait "$build_pid"
          result=$?
          kill "$timer_pid" 2>/dev/null || true
          wait "$timer_pid" 2>/dev/null || true
          if [ "$result" -ne 0 ]; then
            echo "Build stopped with status $result; saving intermediate output."
            echo "BUILD_FAILED=true" >> "$GITHUB_ENV"
            exit 0
          fi
          echo "BUILD_COMPLETE=true" >> "$GITHUB_ENV"
          test -s ../out/Telegram.app/Contents/MacOS/Telegram
          test -s ../out/Telegram.app/Contents/Frameworks/Updater
          ditto -c -k --sequesterRsrc --keepParent ../out/Telegram.app "$GITHUB_WORKSPACE/Xenon-macOS-arm64.zip"
          df -h

      - name: Save intermediate build
        id: save_build_cache
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: TBuild/tdesktop/out
          key: macos-arm64-ninja-objects-v1-${{ env.MAC_TOOLCHAIN_KEY }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Remove superseded build cache
        if: ${{ steps.save_build_cache.outcome == 'success' && steps.build_cache.outputs.cache-matched-key != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          OLD_CACHE_KEY: ${{ steps.build_cache.outputs.cache-matched-key }}
        run: gh cache delete "$OLD_CACHE_KEY" --repo "$GITHUB_REPOSITORY"

      - name: Upload macOS build
        if: env.BUILD_COMPLETE == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: Xenon-macOS-arm64-Release
          path: Xenon-macOS-arm64.zip
          if-no-files-found: error
          retention-days: 14

      - name: Report build failure
        if: env.BUILD_FAILED == 'true'
        run: exit 1
