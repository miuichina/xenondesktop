name: macOS
run-name: macOS Release | ${{ github.event_name }} | ${{ github.ref_name }}

"on":
  workflow_dispatch:
  push:
    branches: [dev]
    paths-ignore: ['**.md', 'docs/**', 'changelog.txt']

permissions:
  contents: read

concurrency:
  group: macos-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  macos:
    name: macOS arm64 Release
    if: ${{ github.event_name != 'push' || !contains(github.event.head_commit.message, '[skip macos]') }}
    runs-on: macos-15
    timeout-minutes: 360
    env:
      TDESKTOP_MAC_TOOLCHAIN: system
      DEVELOPER_DIR: /Applications/Xcode.app/Contents/Developer
      CMAKE_BUILD_PARALLEL_LEVEL: 3
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: TBuild/tdesktop
          submodules: recursive
          persist-credentials: false

      - name: Check API credentials
        env:
          API_ID: ${{ secrets.TDESKTOP_API_ID }}
          API_HASH: ${{ secrets.TDESKTOP_API_HASH }}
        run: test -n "$API_ID" && test -n "$API_HASH"

      - name: Prepare tools
        run: |
          df -h
          brew install automake libtool cmake wget pkg-config gnu-tar ninja nasm meson
          SDKROOT=$(xcrun --sdk macosx --show-sdk-path)
          DEPLOYMENT_TARGET=$(/usr/libexec/PlistBuddy -c 'Print :SupportedTargets:macosx:MinimumDeploymentTarget' "$SDKROOT/SDKSettings.plist")
          echo "SDKROOT=$SDKROOT" >> "$GITHUB_ENV"
          echo "MACOSX_DEPLOYMENT_TARGET=$DEPLOYMENT_TARGET" >> "$GITHUB_ENV"
          { xcodebuild -version; xcrun clang --version; xcrun --sdk macosx --show-sdk-version; echo "$DEPLOYMENT_TARGET"; } > "$RUNNER_TEMP/mac-toolchain.txt"
          echo "MAC_TOOLCHAIN_KEY=$(shasum -a 256 "$RUNNER_TEMP/mac-toolchain.txt" | cut -d ' ' -f 1)" >> "$GITHUB_ENV"
          df -h

      - name: Restore dependencies
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            TBuild/Libraries
            TBuild/ThirdParty
          key: macos-arm64-release-libs-v1-${{ env.MAC_TOOLCHAIN_KEY }}-${{ hashFiles('TBuild/tdesktop/Telegram/build/prepare/**', 'TBuild/tdesktop/Telegram/build/qt_version.py', 'TBuild/tdesktop/Telegram/build/build_mac.py') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            macos-arm64-release-libs-v1-${{ env.MAC_TOOLCHAIN_KEY }}-${{ hashFiles('TBuild/tdesktop/Telegram/build/prepare/**', 'TBuild/tdesktop/Telegram/build/qt_version.py', 'TBuild/tdesktop/Telegram/build/build_mac.py') }}-

      - name: Prepare dependencies
        id: prepare
        run: |
          cd TBuild
          ./tdesktop/Telegram/build/prepare/mac.sh silent
          df -h

      - name: Reduce dependency cache size
        if: ${{ !cancelled() && steps.prepare.outcome != 'skipped' }}
        run: |
          if [ -d TBuild/Libraries ]; then
            find TBuild/Libraries '(' '(' ! '(' -name '*.a' -o -name '*.h' -o -name '*.hpp' -o -name '*.inc' -o -name '*.cmake' -o -name '*.pc' -o -name 'macos_toolchain.json' -o -path '*/include/*' -o -path '*/objects-*' -o -path '*/cache_keys/*' -o -path '*/patches/*' ')' -type f ')' -o -empty ')' -delete
          fi

      - name: Save dependencies
        if: ${{ !cancelled() && steps.prepare.outcome != 'skipped' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            TBuild/Libraries
            TBuild/ThirdParty
          key: macos-arm64-release-libs-v1-${{ env.MAC_TOOLCHAIN_KEY }}-${{ hashFiles('TBuild/tdesktop/Telegram/build/prepare/**', 'TBuild/tdesktop/Telegram/build/qt_version.py', 'TBuild/tdesktop/Telegram/build/build_mac.py') }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Build Release
        env:
          API_ID: ${{ secrets.TDESKTOP_API_ID }}
          API_HASH: ${{ secrets.TDESKTOP_API_HASH }}
        run: |
          cd TBuild/tdesktop/Telegram
          ./configure.sh \
            -D CMAKE_CONFIGURATION_TYPES=Release \
            -D CMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_ALLOWED=NO \
            -D CMAKE_OSX_SYSROOT="$SDKROOT" \
            -D CMAKE_OSX_DEPLOYMENT_TARGET="$MACOSX_DEPLOYMENT_TARGET" \
            -D CMAKE_OSX_ARCHITECTURES=arm64 \
            -D DESKTOP_APP_MAC_ARCH=arm64 \
            -D DESKTOP_APP_SPECIAL_TARGET=mac \
            -D DESKTOP_APP_ENABLE_LTO=OFF \
            -D DESKTOP_APP_DISABLE_AUTOUPDATE=ON \
            -D "TDESKTOP_API_ID=$API_ID" -D "TDESKTOP_API_HASH=$API_HASH"
          cmake --build ../out --config Release --target Telegram --parallel 3
          test -s ../out/Release/Telegram.app/Contents/MacOS/Telegram
          ditto -c -k --sequesterRsrc --keepParent ../out/Release/Telegram.app "$GITHUB_WORKSPACE/Xenon-macOS-arm64.zip"
          df -h

      - name: Upload macOS build
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: Xenon-macOS-arm64-Release
          path: Xenon-macOS-arm64.zip
          if-no-files-found: error
          retention-days: 14
