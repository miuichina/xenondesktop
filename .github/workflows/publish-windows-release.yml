name: Publish multi-platform release

"on":
  workflow_run:
    workflows: [Windows x64, Linux x64, macOS]
    types: [completed]
  workflow_dispatch:
    inputs:
      run_id:
        description: Successful Windows build run ID to publish without rebuilding
        required: false
        type: string
      linux_run_id:
        description: Successful Linux build run ID for the same commit
        required: false
        type: string
      macos_run_id:
        description: Successful macOS build run ID for the same commit
        required: false
        type: string

permissions:
  actions: read
  contents: write

concurrency:
  group: windows-release-publish
  cancel-in-progress: false
  queue: max

jobs:
  publish:
    outputs:
      published: ${{ steps.release.outputs.published }}
      build_sha: ${{ steps.release.outputs.build_sha }}
      tag: ${{ steps.release.outputs.tag }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout release tooling and history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: dev
          fetch-depth: 0
          persist-credentials: false

      - name: Locate enabled successful platform builds
        run: python3 .github/scripts/publish_release.py prepare

      - name: Download and verify platform artifacts
        if: env.SKIP_PUBLISH != 'true'
        run: python3 .github/scripts/publish_release.py download

      - name: Publish release
        id: release
        if: env.SKIP_PUBLISH != 'true'
        run: python3 .github/scripts/publish_release.py publish

  telegram:
    needs: publish
    if: needs.publish.outputs.published == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    continue-on-error: true
    permissions:
      contents: read
    steps:
      - name: Check Telegram configuration
        id: config
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [[ -n "$TG_TOKEN" && -n "$TG_CHAT_ID" ]]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo 'Telegram announcement skipped: secrets are not configured.'
          fi

      - name: Checkout release history
        if: steps.config.outputs.enabled == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Announce release in Telegram
        if: steps.config.outputs.enabled == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          BUILD_SHA: ${{ needs.publish.outputs.build_sha }}
          RELEASE_TAG: ${{ needs.publish.outputs.tag }}
        run: python3 .github/scripts/telegram_release.py
