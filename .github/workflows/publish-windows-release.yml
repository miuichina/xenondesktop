name: Publish Windows release

"on":
  workflow_run:
    workflows: [Windows x64]
    types: [completed]
    branches: [dev]
  workflow_dispatch:
    inputs:
      run_id:
        description: Successful Windows build run ID to publish without rebuilding
        required: true
        type: string

permissions:
  actions: read
  contents: write

concurrency:
  group: windows-release-${{ github.event.workflow_run.id || inputs.run_id }}
  cancel-in-progress: false

jobs:
  publish:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    outputs:
      published: ${{ steps.release.outputs.published }}
      build_sha: ${{ steps.release.outputs.build_sha }}
      tag: ${{ steps.release.outputs.tag }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      RUN_ID: ${{ github.event.workflow_run.id || inputs.run_id }}
    steps:
      - name: Verify the successful build and download its EXE
        shell: bash
        run: |
          [[ "$RUN_ID" =~ ^[0-9]+$ ]] || { echo 'Invalid run ID'; exit 1; }
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID" > build.json
          jq -e --arg repo "$GITHUB_REPOSITORY" '
            .conclusion == "success" and
            .head_branch == "dev" and
            .head_repository.full_name == $repo and
            .path == ".github/workflows/win.yml"
          ' build.json > /dev/null
          sha=$(jq -r '.head_sha' build.json)
          echo "BUILD_SHA=$sha" >> "$GITHUB_ENV"
          gh api "repos/$GITHUB_REPOSITORY/commits/$sha" --jq '.commit.message | split("\n")[0]' > title.txt
          gh run download "$RUN_ID" --repo "$GITHUB_REPOSITORY" --name Xenon-Windows-x64-Release --dir release
          test -s release/Telegram.exe
          (cd release && sha256sum Telegram.exe > SHA256SUMS.txt)

      - name: Publish release
        id: release
        shell: bash
        run: |
          tag="windows-build-$RUN_ID"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo 'This build already has a release.'
            exit 0
          fi
          printf 'Windows x64 Release\n\nCommit: `%s`\n\n[Build and logs](https://github.com/%s/actions/runs/%s)\n' "$BUILD_SHA" "$GITHUB_REPOSITORY" "$RUN_ID" > notes.md
          gh release create "$tag" release/Telegram.exe release/SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" --target "$BUILD_SHA" \
            --title "$(cat title.txt)" --notes-file notes.md --latest
          echo "published=true" >> "$GITHUB_OUTPUT"
          echo "build_sha=$BUILD_SHA" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  telegram:
    needs: publish
    if: needs.publish.outputs.published == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    continue-on-error: true
    permissions:
      contents: read
    steps:
      - name: Check Telegram configuration
        id: config
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [[ -n "$TG_TOKEN" && -n "$TG_CHAT_ID" ]]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo 'Telegram announcement skipped: secrets are not configured.'
          fi

      - name: Checkout release history
        if: steps.config.outputs.enabled == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Announce release in Telegram
        if: steps.config.outputs.enabled == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          BUILD_SHA: ${{ needs.publish.outputs.build_sha }}
          RELEASE_TAG: ${{ needs.publish.outputs.tag }}
        run: python3 .github/scripts/telegram_release.py
