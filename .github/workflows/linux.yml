name: Linux x64
run-name: Linux x64 Release | ${{ github.event_name }} | ${{ github.ref_name }}

"on":
  workflow_dispatch:
  push:
    branches: [dev]
    paths-ignore: ['**.md', 'docs/**', 'changelog.txt']

permissions:
  contents: read

concurrency:
  group: linux-x64-${{ github.ref }}
  cancel-in-progress: false

jobs:
  linux:
    name: Linux x64 Release
    if: ${{ github.event_name != 'push' || !contains(github.event.head_commit.message, '[skip linux]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          submodules: recursive
          persist-credentials: false

      - name: Check API credentials
        env:
          API_ID: ${{ secrets.TDESKTOP_API_ID }}
          API_HASH: ${{ secrets.TDESKTOP_API_HASH }}
        run: test -n "$API_ID" && test -n "$API_HASH"

      - name: Record runner resources
        run: |
          df -h
          free -h

      - name: Prepare Docker image
        run: |
          sudo apt-get update
          sudo apt-get install -y gnupg python3-jinja2 zstd
          cd Telegram/build/docker/centos_env
          DEBUG= LTO= JOBS=4 python3 gen_dockerfile.py > Dockerfile.generated
          sed -i 's/^dnf -y install cmake /dnf -y --refresh --nobest install cmake /' Dockerfile.generated

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and cache dependencies
        uses: docker/build-push-action@v7
        with:
          context: Telegram/build/docker/centos_env
          file: Telegram/build/docker/centos_env/Dockerfile.generated
          load: true
          tags: xenon-linux-build
          cache-from: type=gha,scope=xenon-linux-release-v1
          cache-to: type=gha,scope=xenon-linux-release-v1,mode=max,ignore-error=true

      - name: Check build Python XML support
        run: |
          docker run --rm --entrypoint /usr/bin/python3.11 xenon-linux-build \
            -c 'import pyexpat; import xml.etree.ElementTree as ET; ET.fromstring("<release/>"); print("Python XML parser OK:", pyexpat.EXPAT_VERSION)'

      - name: Identify Linux build environment
        id: build_environment
        run: |
          image=$(docker image inspect --format '{{json .RootFS.Layers}} {{json .Config.Env}}' xenon-linux-build)
          digest=$(printf '%s' "$image" | sha256sum | cut -d ' ' -f 1)
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Restore intermediate build archive
        id: build_cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ runner.temp }}/linux-build.tar.zst.gpg
          key: linux-objects-v1-${{ runner.arch }}-${{ steps.build_environment.outputs.digest }}-${{ hashFiles('.github/workflows/linux.yml') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            linux-objects-v1-${{ runner.arch }}-${{ steps.build_environment.outputs.digest }}-${{ hashFiles('.github/workflows/linux.yml') }}-

      - name: Restore compiler cache
        id: compiler_cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ runner.temp }}/linux-ccache.tar.gz.enc
          key: linux-ccache-v1-${{ hashFiles('Telegram/build/docker/centos_env/**') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            linux-ccache-v1-${{ hashFiles('Telegram/build/docker/centos_env/**') }}-

      - name: Prepare compiler cache
        env:
          CACHE_PASSWORD: ${{ secrets.TDESKTOP_API_HASH }}
        run: |
          mkdir -p .ci-ccache
          if [ -f "$RUNNER_TEMP/linux-ccache.tar.gz.enc" ]; then
            if ! openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -pass env:CACHE_PASSWORD -in "$RUNNER_TEMP/linux-ccache.tar.gz.enc" | tar -xz -C .ci-ccache; then
              echo 'Compiler cache could not be restored; starting with an empty cache.'
              rm -rf .ci-ccache
              mkdir -p .ci-ccache
            fi
          fi

      - name: Keep compiler warnings non-fatal
        run: |
          grep -Fx '        -Werror' cmake/options_linux.cmake
          sed -i '/^        -Werror$/d' cmake/options_linux.cmake

      - name: Restore intermediate build and source timestamps
        if: steps.build_cache.outputs.cache-matched-key != ''
        shell: bash
        env:
          CACHE_PASSWORD: ${{ secrets.TDESKTOP_API_HASH }}
        run: |
          restore=$(mktemp -d "$PWD/.ci-build-cache.XXXXXX")
          trap 'rm -rf -- "$restore"' EXIT
          if [ ! -e out ] && \
              gpg --batch --no-symkey-cache --pinentry-mode loopback --passphrase-fd 3 \
                --decrypt "$RUNNER_TEMP/linux-build.tar.zst.gpg" 3<<<"$CACHE_PASSWORD" | \
              tar --zstd -xf - -C "$restore" && \
              test -f "$restore/out/.ci-source-mtimes.json" && \
              python3 .github/scripts/macos_cache_mtimes.py restore "$restore/out/.ci-source-mtimes.json" && \
              mv -T "$restore/out" out; then
            echo 'Restored the Linux Ninja build.'
          else
            echo 'Intermediate build cache unavailable. Continuing with ccache.'
          fi

      - name: Build Release
        id: build
        env:
          API_ID: ${{ secrets.TDESKTOP_API_ID }}
          API_HASH: ${{ secrets.TDESKTOP_API_HASH }}
        run: |
          docker run --rm -u "$(id -u):$(id -g)" \
            -v "$PWD:/usr/src/tdesktop" -w /usr/src/tdesktop \
            -e CMAKE_BUILD_PARALLEL_LEVEL=4 \
            -e CCACHE_DIR=/usr/src/tdesktop/.ci-ccache \
            -e CCACHE_MAXSIZE=3G \
            -e CCACHE_SLOPPINESS=pch_defines,time_macros \
            --entrypoint /usr/bin/env xenon-linux-build -u CCACHE_DISABLE \
            /usr/src/tdesktop/Telegram/build/docker/centos_env/build.sh \
            -D CMAKE_CONFIGURATION_TYPES=Release \
            -D Python3_EXECUTABLE=/usr/bin/python3.11 \
            -D 'CMAKE_CXX_FLAGS=-fpch-preprocess -Wno-error=aggressive-loop-optimizations -Wno-error=range-loop-construct -Wno-error=unused-local-typedefs' \
            -D 'CMAKE_C_FLAGS=-Wno-error=stringop-overread' \
            -D DESKTOP_APP_SPECIAL_TARGET=linux \
            -D DESKTOP_APP_ENABLE_LTO=OFF \
            -D DESKTOP_APP_DISABLE_AUTOUPDATE=OFF \
            -D TDESKTOP_BUILD_PACKER=ON \
            -D XENON_BUILD_NUMBER=${{ github.run_number }} \
            -D "TDESKTOP_API_ID=$API_ID" -D "TDESKTOP_API_HASH=$API_HASH"
          test -s out/Release/Telegram
          test -s out/Release/Updater
          mkdir -p artifact/Xenon
          cp out/Release/Telegram artifact/Xenon/Telegram
          cp out/Release/Updater artifact/Xenon/Updater
          python3 -c 'import shutil; shutil.make_archive("artifact/Xenon-Linux-x64", "zip", "artifact", "Xenon")'
          df -h

      - name: Archive intermediate build
        id: archive_build
        if: ${{ !cancelled() && steps.build.outcome != 'skipped' }}
        continue-on-error: true
        shell: bash
        env:
          CACHE_PASSWORD: ${{ secrets.TDESKTOP_API_HASH }}
        run: |
          if [ ! -s out/.ninja_log ] || [ ! -f out/build-Release.ninja ]; then
            echo 'No reusable Linux Ninja build to archive.'
            exit 0
          fi
          python3 .github/scripts/macos_cache_mtimes.py save out/.ci-source-mtimes.json --source-only
          tar --format=pax -I 'zstd -T2 -3' -cf - out | \
            gpg --batch --no-symkey-cache --pinentry-mode loopback --passphrase-fd 3 \
              --cipher-algo AES256 --compress-algo none --symmetric \
              --output "$RUNNER_TEMP/linux-build-new.tar.zst.gpg" 3<<<"$CACHE_PASSWORD"
          mv -f -- "$RUNNER_TEMP/linux-build-new.tar.zst.gpg" "$RUNNER_TEMP/linux-build.tar.zst.gpg"
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - name: Save intermediate build archive
        if: ${{ !cancelled() && steps.archive_build.outputs.ready == 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ runner.temp }}/linux-build.tar.zst.gpg
          key: ${{ steps.build_cache.outputs.cache-primary-key }}

      - name: Show compiler cache statistics
        if: ${{ !cancelled() && steps.build.outcome != 'skipped' }}
        run: |
          docker run --rm -u "$(id -u):$(id -g)" \
            -v "$PWD/.ci-ccache:/cache" -e CCACHE_DIR=/cache \
            --entrypoint /usr/bin/env xenon-linux-build -u CCACHE_DISABLE ccache -s

      - name: Archive compiler cache
        id: archive_cache
        if: ${{ !cancelled() && steps.build.outcome != 'skipped' }}
        env:
          CACHE_PASSWORD: ${{ secrets.TDESKTOP_API_HASH }}
        run: |
          tar -cz -C .ci-ccache . | openssl enc -aes-256-cbc -pbkdf2 -iter 200000 -salt -pass env:CACHE_PASSWORD -out "$RUNNER_TEMP/linux-ccache.tar.gz.enc"

      - name: Save compiler cache
        if: ${{ !cancelled() && steps.archive_cache.outcome == 'success' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ runner.temp }}/linux-ccache.tar.gz.enc
          key: ${{ steps.compiler_cache.outputs.cache-primary-key }}

      - name: Sign Linux update
        env:
          XENON_UPDATE_SIGNING_KEY: ${{ secrets.XENON_UPDATE_SIGNING_KEY }}
        run: |
          docker run --rm -u "$(id -u):$(id -g)" \
            -v "$PWD:/usr/src/tdesktop" -w /usr/src/tdesktop \
            -e XENON_UPDATE_SIGNING_KEY \
            --entrypoint /usr/bin/python3.11 xenon-linux-build \
            .github/scripts/xenon_updates.py package --platform linux \
            --source . --output artifact --build-number "$GITHUB_RUN_NUMBER" \
            --run-id "$GITHUB_RUN_ID"

      - name: Upload Linux build
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: Xenon-Linux-x64-Release
          path: |
            artifact/Xenon-Linux-x64.zip
            artifact/xenon-update-linux-x64.json
            artifact/td-update-linux-x64-*
          if-no-files-found: error
          retention-days: 14
